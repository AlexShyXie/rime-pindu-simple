patch:
  schema/name: 万象拼读并

  switches/@before 2:
    __patch:
      - name: popping
        states: [整句, 顶功]
        reset: 0

  speller/alphabet: 'zyxwvutsrqponmlkjihgfedcbaZYXWVUTSRQPONMLKJIHGFEDCBA1234567890`/'
  # Tips 配置项
  tips:
    # 禁用的 tips 类型，初始化 tips 数据库的时候会直接忽略相关规则，修改部署后生效
    # 可选项为：偏旁，符号，化学式，时间，符号，组字，翻译，表情，货币，车牌
    disabled_types: [翻译]

  #在8105基础上你可以通过黑白名单微调你自己的字符集过滤清单，主数据库位于lua/charset.bin不可编辑
  charsetlist: []
  charsetblacklist: []

  speller/algebra:
    __patch:
      - 拼读并击     #拼音转拼读并击
      - 直接辅助     #辅助码部分

  schema/dependencies/@0: 

  # 输入引擎
  engine:
    processors:
      - ascii_composer                       #处理英文模式及中英文切换
      # - lua_processor@*super_processor       #KP小键盘、字母选词、符号快打、超强分词、重复限制、退格限制、声调回退、以词定字
      # - lua_processor@*partial_commit        #通过ctrl+1~0局部提交10个字以内的句子的前几个字（一般为正确的前几个）使用时要遵循合理的分词结构能促进后续编码打出正确的词汇
      - lua_processor@*super_sequence*P      #手动排序，高亮候选 ctrl+j左移动 ctrl+k 右移动 ctrl+l 移除位移  ctrl+p 置顶
      - lua_processor@*super_tips            #超级提示模块：表情、简码、翻译、化学式、等等靠你想象
      - chord_composer
      - lua_processor@*snow.combo_popping    #冰雪一拼并击lua
      - recognizer                           #与 matcher 搭配，处理符合特定规则的输入码，如网址、反查等 tags
      - key_binder                           #在特定条件下将按键绑定到其他按键，如重定义逗号、句号为候选翻页、开关快捷键等
      - lua_processor@*key_binder            #绑定按键扩展能力，支持正则扩展将按键生效情景更加细化
      - speller                              #拼写处理器，接受字符按键，编辑输入
      - punctuator                           #符号处理器，将单个字符按键直接映射为标点符号或文字
      - selector                             #选字处理器，处理数字选字键〔可以换成别的哦〕、上、下候选定位、换页
      - navigator                            #处理输入栏内的光标移动
      - express_editor                       #编辑器，处理空格、回车上屏、回退键
    segmentors:
      - ascii_segmentor                      #标识英文段落〔譬如在英文模式下〕字母直接上屛
      - matcher                              #配合 recognizer 标识符合特定规则的段落，如网址、反查等，加上特定 tag
      - abc_segmentor                        #标识常规的文字段落，加上 abc 这个 tag
      - affix_segmentor@wanxiang_reverse     #反查 tag
      - affix_segmentor@add_user_dict        #自造词加词 tag
      - punct_segmentor                      #标识符号段落〔键入标点符号用〕加上 punct 这个 tag
      - fallback_segmentor                   #标识其他未标识段落，必须放在最后帮助tag模式切换后回退重新处理
    translators:
      - punct_translator                     #配合 punct_segmentor 转换标点符号
      - script_translator                    #脚本翻译器，用于拼音、粤拼等基于音节表的输入方案
      - lua_translator@*version_display      #输入'/wx'，显示万象项目网址和当前版本号
      - lua_translator@*set_schema           #输入'/zrm'，快速切换为自然码双拼， /flypy→小鹤双拼 /mspy→微软双拼 /zrm→自然码 /sogou→搜狗双拼 /abc→智能ABC /ziguang→紫光双拼 /pyjj→拼音加加 /gbpy→国标双拼 /lxsq→乱序17 /pinyin→全拼
      - lua_translator@*shijian              #农历、日期、节气、节日、时间、周、问候模板等等，触发清单看下文
      - lua_translator@*unicode              #通过输入大写U引导，并输入Unicode编码获得汉字输出
      - lua_translator@*number_translator    #数字、金额大写，通过输入大写R1234获得候选输出
      # - lua_translator@*super_calculator     #超级计算器，Lua内查看高级用法
      - lua_translator@*input_statistics     #一个输入统计的脚本，以日、周、月、年等维度的统计
      - table_translator@custom_phrase       #自定义短语 custom_phrase.txt，用于置顶自定义编码候选词
      - table_translator@chengyu             #简码成语词汇表导入
      # - table_translator@wanxiang_english    #英文词汇表导入
      # - table_translator@wanxiang_mixedcode  #混合编码词汇表导入
      - reverse_lookup_translator@wanxiang_reverse    #挂接部件组字和笔画反查
      - script_translator@user_dict_set      #自造词之使用词汇入口
      - script_translator@add_user_dict      #自造词之制造词汇入口
    filters:
      - lua_filter@*snow.fix                          #冰雪一拼简字简词
      - lua_filter@*auto_phrase                       #comment前，无感造词，关闭调频的时候将汉字写入次翻译器，当没有英文候选的时候追加\上屏可完成英文造词
      - lua_filter@*super_lookup                      #comment前，字词输入中反查辅助筛选
      - lua_filter@*super_comment_preedit             #OpenCC前，超级注释模块、超级preedit，支持错词提示、辅助码显示，部件组字读音注释，有声调、无声调全拼编码的转换，支持个性化配置和关闭相应的功能，详情搜索super_comment_preedit进行详细配置
      - lua_filter@*super_replacer                    #OpenCC替代器，更灵活的处理方式，更自由的自定义方式，支持简繁转换、简码模式、支持候选替换、注释替换、候选派生等等
      - lua_filter@*super_filter                      #replacer后面，先进行转换后过滤，这样能繁体继承简体权重。本质功能相关功能见Lua文件
      # - lua_filter@*super_english                     #comment前,负责英文方案及中英混输中英文单词格式化，语句流，自动加空格等策略
      - lua_filter@*super_sequence*F                  #手动排序，对高亮候选 ctrl+j左移动 ctrl+k 右移动 ctrl+0 移除位移
      - uniquifier                                    #去重





  # 主翻译器
  translator/preedit_format/+:
    # 字母标调
    - xlit/wyxq/1234/
    # 隐含的韵母
    - xform/([zcs]j?|r)(?=\d)/$1i/
    - xform/([zcs]h?|r)(?=\d)/$1i/
    - xform/(?<=[bpmf])(?=\d)/u/
    - xform/rj(?=\d)/rjer/
    # 声介变换
    - xform/([zcs])j/$1h/
    - xform/rji(\d|en\d|eng\d)/rjyi$1/
    - xform/rji/rjy/
    - xform/rju(\d)/rjwu$1/
    - xform/rju/rjw/
    - xform/rjv/rjyv/
    - xform/rj//
    - xform/g(?=[iv])/j/
    - xform/k(?=[iv])/q/
    - xform/(?<![zcs])h(?=[iv])/x/
    # 韵调变换
    - xform/(?<=[bpmfuw])e(?=\d)/o/
    - xform/yveng/yong/
    - xform/veng/iong/
    - xform/ueng/ong/
    - xform/ieng/ing/
    - xform/(?<=[iuv])en/n/
    - xform/iou/iu/
    - xform/uei/ui/
    - xform/([jqxy])v/$1u/
  # 次翻译器
  user_dict_set/preedit_format/+:
    # 字母标调
    - xlit/wyxq/1234/
    # 隐含的韵母
    - xform/([zcs]j?|r)(?=\d)/$1i/
    - xform/([zcs]h?|r)(?=\d)/$1i/
    - xform/(?<=[bpmf])(?=\d)/u/
    - xform/rj(?=\d)/rjer/
    # 声介变换
    - xform/([zcs])j/$1h/
    - xform/rji(\d|en\d|eng\d)/rjyi$1/
    - xform/rji/rjy/
    - xform/rju(\d)/rjwu$1/
    - xform/rju/rjw/
    - xform/rjv/rjyv/
    - xform/rj//
    - xform/g(?=[iv])/j/
    - xform/k(?=[iv])/q/
    - xform/(?<![zcs])h(?=[iv])/x/
    # 韵调变换
    - xform/(?<=[bpmfuw])e(?=\d)/o/
    - xform/yveng/yong/
    - xform/veng/iong/
    - xform/ueng/ong/
    - xform/ieng/ing/
    - xform/(?<=[iuv])en/n/
    - xform/iou/iu/
    - xform/uei/ui/
    - xform/([jqxy])v/$1u/

#并击处理器
  chord_composer:
    finish_chord_on_first_key_release: true #有一键被释放时立刻触发合成
    alphabet: "qazwsxedcrfvtgbyhnujmik,ol.p;/' "
    algebra:
      # 双手并击，打出音节
      - xform|^([qazwsxedcrfvtgb]+)([p;/ol.ik,ujmyhn]+)$|★$1★★$2★|
      # 双手带空格并击，打出追加音节，这里 u 表示追加
      - xform|^([qazwsxedcrfvtgb]+)([p;/ol.ik,ujmyhn]+) $|u★$1★★$2★|
      # 左手或右手带空格并击，打出辅助码)######################################(注释掉,使用万象的辅助码)
      # - xform/^([qazwsxedcrfvtgb]+) $/v★$1★v/
      # - xform/^([yhnujmikolp]+) $/v$1$1v/
      # 左手并击，打出声介（一简字）
      - xform/^([qazwsxedcrfvtgb]+)$/o★$1★ /
      # 左手并击带空格，打出声介的二选（一简词）
      - xform/^([qazwsxedcrfvtgb]+) $/o★$1★- /
      # 右手并击，打出符号和功能键
      - xform|^h$|/iduh |
      - xform|^j$|/idh |
      - xform|^k$|/ijh |
      - xform|^l$|/iwh |
      - xform|^y$|/ipzh |
      - xform|^u$|/izsyh |
      - xform|^i$|/iysyh |
      - xform|^o$|/imh |
      - xform|^p$|/ifh |
      - xform|^n$|/islh |
      - xform|^m$|/ith |
      - xform|^ui$|/izkh |
      - xform|^io$|/iykh |
      - xform|^uo$|/izsmh |
      - xform|^up$|/iysmh |
      - xform|^m,$|/ifgh |
      - xform|^,\.$|/iblh |
      - xform|^m\.$|/izdyh |
      - xform|^m\/$|/iydyh |
      - xform/^jk$/- /
      - xform/^kl$/-- /
      - xform/^jl$/--- /
      - xform/^j;$/---- /
      - xform/-/{Down}/
      - xform/^hk$/{Page_Up}/
      - xform/^hl$/{Page_Down}/
      - xform/^op$/{Control+BackSpace}/
      # 左手+右手'jio'并击，打出辅助码
      - xform|^★([qazwsxedcrfvtgb])★★jio★$|\U$1|
      # 右手+左手'wef'并击，打出辅助码
      - xform|^★wef★★([polikujmyhn])★$|\U$1|


      # 左手声介
      - xform/★zv★/rj/
      - xform/★d★/rji/
      - xform/★e★/rju/
      - xform/★sd★/rjv/
      - xform/★w★/b/
      - xform/★sg★/bi/
      - xform/★eg★/p/
      - xform/★xg★/pi/
      - xform/★c★/m/
      - xform/★qf★/mi/
      - xform/★t★/f/
      - xform/★f★/d/
      - xform/★xc★/di/
      - xform/★cv★/du/
      - xform/★af★/t/
      - xform/★wf★/ti/
      - xform/★zf★/tu/
      - xform/★dg★/n/
      - xform/★cf★/ni/
      - xform/★se★/nu/
      - xform/★xd★/nv/
      - xform/★b★/l/
      - xform/★x★/li/
      - xform/★wg★/lu/
      - xform/★as★/lv/
      - xform/★sf★/g/
      - xform/★v★/gu/
      - xform/★xv★/k/
      - xform/★cg★/ku/
      - xform/★z★/h/
      - xform/★er★/hu/
      - xform/★a★/gi/
      - xform/★sr★/gv/
      - xform/★df★/ki/
      - xform/★sv★/kv/
      - xform/★r★/hi/
      - xform/★dr★/hv/
      - xform/★g★/zj/
      - xform/★we★/zju/
      - xform/★qr★/cj/
      - xform/★dv★/cju/
      - xform/★s★/sj/
      - xform/★ag★/sju/
      - xform/★wr★/r/
      - xform/★qg★/ru/
      - xform/★q★/z/
      - xform/★ef★/zu/
      - xform/★xf★/c/
      - xform/★zg★/cu/
      - xform/★av★/s/
      - xform/★ar★/su/
      # 右手韵调
      - xform/★;★/1/
      - xform/★u★/2/
      - xform/★l★/3/
      - xform/★j★/4/
      - xform/★n★/a1/
      - xform/★ul★/a2/
      - xform/★mk★/a3/
      - xform/★io★/a4/
      - xform/★ho★/ai1/
      - xform/★hl★/ai2/
      - xform/★hi★/ai3/
      - xform/★j;★/ai4/
      - xform/★ui★/an1/
      - xform|★/★|an2|
      - xform/★m,★/an3/
      - xform/★o★/an4/
      - xform/★,\.★/ang1/
      - xform/★ji★/ang2/
      - xform/★jo★/ang3/
      - xform/★uo★/ang4/
      - xform/★j\.★/ao1/
      - xform/★u;★/ao2/
      - xform|★m/★|ao3|
      - xform/★kl★/ao4/
      - xform/★k★/e1/
      - xform/★p★/e2/
      - xform/★m★/e3/
      - xform/★h★/e4/
      - xform/★uk★/ei1/
      - xform/★m;★/ei2/
      - xform/★j,★/ei3/
      - xform/★\.★/ei4/
      - xform/★,★/en1/
      - xform/★jl★/en2/
      - xform/★jp★/en3/
      - xform/★hk★/en4/
      - xform/★i★/eng1/
      - xform/★y★/eng2/
      - xform/★h;★/eng3/
      - xform/★jk★/eng4/
      - xform|★j/★|ou1|
      - xform/★ml★/ou2/
      - xform/★up★/ou3/
      - xform/★m\.★/ou4/
      - xlit/1234/wyxq/
    output_format:
      # 首先去除无效的并击组合
      - erase/^.*★.+★.*$/
      # 针对所有可能的音节加上中括号
      - xform/^(u?[bpm])(a|ai|an|ang|ao|e|ei|en|eng|ou|i|ia|ian|iang|iao|ie|ien|ieng|iou)?([wyxq])$/[$1$2$3]/
      - xform/^(u?f)(a|an|ang|e|ei|en|eng|ou)?([wyxq])$/[$1$2$3]/
      - xform/^(u?[dt])(a|ai|an|ang|ao|e|ei|en|eng|ou|i|ia|ian|iao|ie|ieng|iou|u|uan|ue|uei|uen|ueng)?([wyxq])$/[$1$2$3]/
      - xform/^(u?[nl])(a|ai|an|ang|ao|e|ei|en|eng|ou|i|ia|ian|iang|iao|ie|ien|ieng|iou|u|uan|ue|uen|ueng|v|ve)([wyxq])$/[$1$2$3]/
      - xform/^(u?[gkhr]j?)(a|ai|an|ang|ao|e|ei|en|eng|ou|i|ia|ian|iang|iao|ie|ien|ieng|iou|u|ua|uai|uan|uang|ue|uei|uen|ueng|v|van|ve|ven|veng)?([wyxq])$/[$1$2$3]/
      - xform/^(u?[zcs]j)(a|ai|an|ang|ao|e|ei|en|eng|ou|u|ua|uai|uan|uang|ue|uei|uen|ueng)?([wyxq])$/[$1$2$3]/
      - xform/^(u?r)(an|ang|ao|e|en|eng|ou|u|ua|uan|ue|uei|uen|ueng)?([wyxq])$/[$1$2$3]/
      - xform/^(u?[zcs])(a|ai|an|ang|ao|e|ei|en|eng|ou|u|uan|ue|uei|uen|ueng)?([wyxq])$/[$1$2$3]/
      # 单独打声介的情况
      - xform/^(o?[bpmfdtnlgkhzcsr]j?[iuv]?)$/[$1]/
      # 辅助码的情况
      # - xform/^(v.+v)$/[$1]/
      # 去除不合法音节
      - erase/^[a-z]+$/
      - xform/^\[(.+)\]/$1/
    prompt_format:
      # 不显示
      - xform/^(.*)$//

  punctuator/symbols/+:
    '/ith': '！'
    '/islh': '……'
    '/izkh': '（'
    '/iykh': '）'
    '/ifgh': '·'
    '/iblh': '～'
    '/ipzh': '——'
    '/ifh': '；'
    '/imh': '：'
    '/izdyh': '‘'
    '/iydyh': '’'
    '/izsyh': '“'
    '/iysyh': '”'
    '/idh': '，'
    '/izsmh': '《'
    '/ijh': '。'
    '/iysmh': '》'
    '/iduh': '、'
    '/iwh': '？'




拼读并击: 
  __append: 
    - xform/^([a-z]+)(;.*)$/$1①$2/
    - xform/^(.*)ā(.*)(;.*)$/$1a$2①$3/
    - xform/^(.*)á(.*)(;.*)$/$1a$2②$3/
    - xform/^(.*)ǎ(.*)(;.*)$/$1a$2③$3/
    - xform/^(.*)à(.*)(;.*)$/$1a$2④$3/
    - xform/^ō(;.*)$/ou$2①$3/
    - xform/^ó(;.*)$/ou$2②$3/
    - xform/^ǒ(;.*)$/ou$2③$3/
    - xform/^ò(;.*)$/ou$2④$3/
    - xform/^(.*)ō(.*)(;.*)$/$1o$2①$3/
    - xform/^(.*)ó(.*)(;.*)$/$1o$2②$3/
    - xform/^(.*)ǒ(.*)(;.*)$/$1o$2③$3/
    - xform/^(.*)ò(.*)(;.*)$/$1o$2④$3/
    - xform/^(.*)ē(.*)(;.*)$/$1e$2①$3/
    - xform/^(.*)é(.*)(;.*)$/$1e$2②$3/
    - xform/^(.*)ě(.*)(;.*)$/$1e$2③$3/
    - xform/^(.*)è(.*)(;.*)$/$1e$2④$3/
    - xform/^(.*)ī(.*)(;.*)$/$1i$2①$3/
    - xform/^(.*)í(.*)(;.*)$/$1i$2②$3/
    - xform/^(.*)ǐ(.*)(;.*)$/$1i$2③$3/
    - xform/^(.*)ì(.*)(;.*)$/$1i$2④$3/
    - xform/^(.*)ū(.*)(;.*)$/$1u$2①$3/
    - xform/^(.*)ú(.*)(;.*)$/$1u$2②$3/
    - xform/^(.*)ǔ(.*)(;.*)$/$1u$2③$3/
    - xform/^(.*)ù(.*)(;.*)$/$1u$2④$3/
    - xform/^(.*)ǖ(.*)(;.*)$/$1v$2①$3/
    - xform/^(.*)ǘ(.*)(;.*)$/$1v$2②$3/
    - xform/^(.*)ǚ(.*)(;.*)$/$1v$2③$3/
    - xform/^(.*)ǜ(.*)(;.*)$/$1v$2④$3/
    - xform/^(.*)ü(.*)$/$1v$2/
    - xform/^(.*)ń(.*)(;.*)$/$1en$2②$3/
    - xform/^(.*)ň(.*)(;.*)$/$1en$2③$3/
    - xform/^(.*)ǹ(.*)(;.*)$/$1en$2④$3/
    - xlit/①②③④/1234
    - xform/(;\w+)/\U$1/ # 辅助码改大写
    - derive/^ng(\d)(;.*)$/eng$1$2/
    - xform/^n(\d)(;.*)/en$1$2/
    - xform/^m(?=\d)/mu/
    - xform/^hm(?=\d)/hen/
    - xform/^([yl]?)o(?=\d)/$1e/
    # 韵调变换
    - xform/(?<=[jqxy])u/$1v/
    - xform/ui/uei/
    - xform/iu/iou/
    - xform/(?<=[iuv])n/en/
    - xform/ing/ieng/
    - xform/(?<![iy])ong/ueng/
    - xform/(iong|(?<=y)ong)/veng/
    - xform/(?<=[bpmfuw])o(?=\d)/e/
    # 声介变换
    - xlit/jqx/gkh/
    - xform/^(?=[aoeyw])/rj/
    - xform/^rjyv/rjv/
    - xform/^rjyi?/rji/
    - xform/^rjwu?/rju/
    - xform/^([zcs])h/$1j/
    # 隐含的韵母
    - xform/er//
    - xform/(?<=[bpmf])u//
    - xform/^([zcs]j?|r)i/$1/
    # 字母标调
    - xlit/1234/wyxq/
    # 支持声介简拼
    - abbrev/^([bpmfdtnlgkhzcsr]j?[iuv]).+$/$1/

直接辅助:  ########################################位于词库第三个分号后
  __append:
#以下是双拼运算
    - derive/^(.*?);.*$/$1/ # 纯双拼的情况
#分号后面第一组辅助码
    - derive/^(.*?);(\w).*$/$1$2/        # 双拼+一位辅助码的情况
    - abbrev/^(.*?);(\w)(\w).*$/$1$2$3/  # 双拼+2位辅助码的情况
#分号后面第二组辅助码
    - derive/^(.*?);.*?,(\w).*$/$1$2/        # 双拼+一位辅助码的情况
    - abbrev/^(.*?);.*?,(\w)(\w).*$/$1$2$3/  # 双拼+2位辅助码的情况
    - erase/^(.+);(.+)$/    # 删除原始编码加速检索
