# Rime schema
# encoding: utf-8

#__include: snow_pinyin.schema.yaml:/

schema:
  schema_id: snow_yipin
  name: 冰雪一拼
  version: "0.3"
  author:
    - 张皓哲 <576440085@qq.com>
    - 谭淞宸 <i@tansongchen.com>
  description: |
    带调拼音字词顶功输入方案
    拼读并击的顶功和整句版，使用脚本翻译器来达到更好的打词体验
  dependencies:
    #- snow_pinyin
    - snow_xingpang

switches:
  - name: ascii_mode
    states: [ 中文, 西文 ]
    reset: 0
  - name: full_shape
    states: [ 半角, 全角 ]
  - name: traditionalization
    states: [ 汉字, 漢字 ]
  - name: ascii_punct
    states: [ 。，, ．， ]

engine:
  processors:
    - ascii_composer
    - chord_composer
    - lua_processor@*snow.shape_processor
    - lua_processor@*snow.combo_popping
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - lua_translator@*calculator_translator
    - punct_translator
    - script_translator
    - lua_translator@*input_statistics     
  filters:
    - lua_filter@*snow.fix
    - uniquifier
    - lua_filter@*snow.shape_filter
    - simplifier

chord_composer:
  alphabet: "qazwsxedcrfvtgbyhnujmik,ol.p;/'\\ "
  algebra:
    # 左手并击Y，打出声介的三四五六选
    - xform/^([qazwsxedcrfvtgb]+)y$/o $1 -- /
    - xform/^([qazwsxedcrfvtgb]+)uo$/o $1 --- /
    - xform/^([qazwsxedcrfvtgb]+)yp$/o $1 ---- /
    - xform/^([qazwsxedcrfvtgb]+)up$/o $1 ----- /
    - xform/^([qazwsxedcrfvtgb]+)ip$/o $1 ------ /
    - xform/^([qazwsxedcrfvtgb]+)op$/o $1 ------- /
    # 双手并击，打出音节
    - xform|^([qazwsxedcrfvtgb]+)([p;/ol.ik,ujmyhn]+)$| $1  $2 |
    # 双手带空格并击，打出追加音节，这里 u 表示追加
    #- xform|^([qazwsxedcrfvtgb]+)([p;/ol.ik,ujmyhn]+) $|u $1  $2 |
    # 双手带空格并击，打出音节完整音节直接上屏，这里 o 表示追加
    - xform|^([qazwsxedcrfvtgb]+)([p;/ol.ik,ujmyhn]+) $|o $1  $2  |
    # 左手或右手带\并击，打出辅助码
    - xform/^([qazwsxedcrfvtgb]+)'$/v $1 v/
    - xform/^([yhnujmikolp]+)'$/v$1$1v/
    - xform/^([qazwsxedcrfvtgb]+)\\$/v $1 v/
    - xform/^([yhnujmikolp]+)\\$/v$1$1v/
    # 左手单键击键，打出对应按键的字母并且不上屏
    #- xform/^([qazwsxedcrfvtgb])$/a$1/
    - xform/^([qazwsxedcrfvtgb]+)$/o $1  / # 左手单键击键，打出声介的一选（一简字）

    # 左手并击空格，打出声介的一选（一简字）
    # - xform/^([qazwsxedcrfvtgb]+) $/o $1  /
    # 左手并击空格，打出声介的二选（一简词）
    - xform/^([qazwsxedcrfvtgb]+) $/o $1 - / 
    
    # 左手并击右手单引号，打出声介的二选（一简词）
    # - xform/^([qazwsxedcrfvtgb]+)'$/o $1 - /
    # 右手单键击键
    - xform|^h$|iduh | # '、'
    - xform|^j$|idh | # '，'
    - xform|^k$|ijh | # '。'
    - xform|^l$|iwh | # '？'
    - xform|^l $|ith | # '！'
    - xform|^y$|- |
    - xform|^u$|-- |
    # - xform|^i$|iysyh | # '”'
    - xform|^n$|--- |
    - xform|^m$|---- |
    - xform|^o$|----- |
    - xform|^p$|------ |
    # 右手组合击键，打出对应的符号
    - xform|^m,$|{Page_Up}| # '·'
    - xform|^,\.$|{Page_Down}| # 'emoji' 不加空格
    - xform|^m\.$|ibq|
    - xform|^m\/$|idw|
    # - xform/^jk$/- /
    # - xform/^kl$/-- /
    # - xform|^ui$|--- |
    # - xform|^io$|---- | 
    # - xform|^uo$|----- |
    # - xform|^up$|---- | 
    # - xform/^jl$/ith /
    # - xform/^j;$/iwh /
    - xform/-/{Down}/
    # - xform/^hk$/{Page_Up}/
    # - xform/^hl$/{Page_Down}/

    # 右手单键击键，其余的打出对应按键的字母并且不上屏
    - xform/^([i])$/a$1/

    # 左手声介
    - xform/ r /rj/ # 而
    - xform/ df /rji/ # 其
    - xform/ cv /rju/ # 我
    - xform/ sf /rjv/ # 与
    - xform/ sdf /rjv/ # 与
    - xform/ s /b/ # 不
    - xform/ qf /bi/ # 并
    - xform/ x /p/ # 跑
    - xform/ av /pi/ # 批
    - xform/ d /m/ # 们
    - xform/ wef /mi/ # 名
    - xform/ wd /mi/ # fei飞键
    - xform/ c /f/ # 法
    - xform/ f /d/ # 的
    - xform/ ef /di/ # 地
    - xform/ wf /du/ # 对
    - xform/ v /t/ # 他
    - xform/ dv /ti/ # 条
    - xform/ sv /tu/ # 同
    - xform/ g /n/ # 那
    - xform/ rg /ni/ # 你
    - xform/ eg /nu/ # 弄
    - xform/ qg /nv/ # 女
    - xform/ wg /nv/ # fei飞键
    - xform/ ar /l/ # 了
    - xform/ ae /li/ # 两
    - xform/ aw /lu/ # 路
    - xform/ ab /lv/ # 率
    - xform/ q /g/ # 个
    - xform/ qr /gu/ # 过
    - xform/ a /k/ # 看
    - xform/ af /ku/ # 快
    - xform/ z /h/ # 和
    - xform/ zv /hu/ # 或
    - xform/ w /gi/ #j就
    - xform/ t /gv/ #ju句
    - xform/ e /ki/ # qi其
    - xform/ sef /kv/ # qu去
    - xform/ at /kv/ # fei飞键 qu去
    - xform/ zx /hi/ #小
    - xform/ xv /hv/ #学
    - xform/ we /zj/ # 这
    - xform/ qe /zju/ # 中
    - xform/ qwe /zju/ # fei飞键 中
    - xform/ qt /zju/ # fei飞键 中
    - xform/ sd /cj/ # 成
    - xform/ ad /cju/ # 出
    - xform/ asd /cju/ # fei飞键 出
    - xform/ ag /cju/ # fei飞键 出
    - xform/ xc /sj/ # 是
    - xform/ zc /sju/ # 说
    - xform/ zxc /sju/ # fei飞键 说
    - xform/ zb /sju/ # 说
    - xform/ er /r/ # 人
    - xform/ wr /ru/ # 如
    - xform/ wer /ru/ # fei飞键 如
    - xform/ zf /z/ # 在
    - xform/ zd /zu/ # 最
    - xform/ sdv /c/ # 才
    - xform/ sc /c/ # 才
    - xform/ b /cu/ # 从
    #- xform/ sc /cu/ # fei飞键 从
    - xform/ sr /s/ # 三
    - xform/ sg /s/ # fei飞键 三
    - xform/ se /su/ # 所
    # 右手韵调,注意/需|
    - xform/ p /1/
    - xform/ o /2/
    - xform/ i /3/
    - xform/ u /4/
    - xform| / |a1|
    - xform/ \. /a2/
    - xform/ , /a3/
    - xform/ m /a4/
    - xform/ n; /ai1/
    - xform/ \.; /ai2/
    - xform/ nj /ai2/ # fei飞键
    - xform/ ,l /ai3/
    - xform/ mkl /ai3/ # fei飞键
    - xform/ mk /ai4/
    - xform| n/ |an1|
    - xform/ nm /an2/ # fei飞键
    - xform| \./ |an2|
    - xform/ ,\. /an3/
    - xform/ m, /an4/
    - xform| m/ |ang1|
    - xform/ n, /ang2/
    - xform| ,\./ |ang3|
    - xform/ ,/ /ang3/ # fei飞键
    - xform/ io /ang3/ # fei飞键
    - xform/ m\. /ang4/
    - xform/ m,\. /ang4/ # fei飞键
    - xform/ m; /ao1/
    - xform/ nk /ao2/
    - xform/ n /ao3/
    - xform/ ml /ao4/
    - xform/ ; /e1/
    - xform/ l /e2/
    - xform/ k /e3/
    - xform/ j /e4/
    - xform/ hp /ei1/
    - xform/ hu /ei2/
    - xform/ ko /ei3/
    - xform/ jio /ei3/ # fei飞键
    - xform/ ji /ei4/
    - xform/ h; /en1/
    - xform/ hj /en2/
    - xform/ kl /en3/
    - xform/ jk /en4/
    - xform/ j; /eng1/
    - xform/ hk /eng2/
    - xform/ kl; /eng3/
    - xform/ k; /eng3/ # fei飞键
    - xform/ ui /eng3/ # fei飞键
    - xform/ jl /eng4/
    - xform/ jkl /eng4/ # fei飞键
    - xform/ jp /ou1/
    - xform/ hi /ou2/
    - xform/ h /ou3/
    - xform/ jo /ou4/
    - xlit/1234/wyxq/
  output_format:
    # 首先去除无效的并击组合
    - erase/^.* .+ .*$/
    # 针对所有可能的音节加上中括号
    - xform/^(u?[bpm])(a|ai|an|ang|ao|e|ei|en|eng|ou|i|ia|ian|iang|iao|ie|ien|ieng|iou)?([wyxq])$/[$1$2$3]/
    - xform/^(u?f)(a|an|ang|e|ei|en|eng|ou)?([wyxq])$/[$1$2$3]/
    - xform/^(u?[dt])(a|ai|an|ang|ao|e|ei|en|eng|ou|i|ia|ian|iao|ie|ieng|iou|u|uan|ue|uei|uen|ueng)?([wyxq])$/[$1$2$3]/
    - xform/^(u?[nl])(a|ai|an|ang|ao|e|ei|en|eng|ou|i|ia|ian|iang|iao|ie|ien|ieng|iou|u|uan|ue|uen|ueng|v|ve)([wyxq])$/[$1$2$3]/
    - xform/^(u?[gkhr]j?)(a|ai|an|ang|ao|e|ei|en|eng|ou|i|ia|ian|iang|iao|ie|ien|ieng|iou|u|ua|uai|uan|uang|ue|uei|uen|ueng|v|van|ve|ven|veng)?([wyxq])$/[$1$2$3]/
    - xform/^(u?[zcs]j)(a|ai|an|ang|ao|e|ei|en|eng|ou|u|ua|uai|uan|uang|ue|uei|uen|ueng)?([wyxq])$/[$1$2$3]/
    - xform/^(u?r)(an|ang|ao|e|en|eng|ou|u|ua|uan|ue|uei|uen|ueng)?([wyxq])$/[$1$2$3]/
    - xform/^(u?[zcs])(a|ai|an|ang|ao|e|ei|en|eng|ou|u|uan|ue|uei|uen|ueng)?([wyxq])$/[$1$2$3]/
    # 单独打声介的情况
    - xform/^(o?[bpmfdtnlgkhzcsr]j?[iuv]?)$/[$1]/
    # 辅助码的情况
    - xform/^(v.+v)$/[$1]/
    # i和单手击键的情况
    - xform/^a([qazwsxedcrfvtgb])$/[$1]/
    - xform/^a([polikujmyhn])$/[$1]/
    - xform/^(i.+)$/[$1]/
    # 去除不合法音节
    - erase/^[a-z]+$/
    - xform/^\[(.+)\]/$1/
  prompt_format:
    # 加方括弧
    - 'xform/^(.*)$/[$1]/'

editor:
  bindings:
    # 退格鍵刪除一個拼音音節
    BackSpace: back_syllable

speller:
  alphabet: "bpmfdtnlgkhjqxzcsrywaeiouvZYXWVUTSRQPONMLKJIHGFEDCBA/"
  initials: "bpmfdtnlgkhjqxzcsrywaeiouv/"
  shape:
    # v 表示辅助码结束
    # - match: "[bpmfdtnlgkhjqxzcsr]j?[iuv]?(a|ai|an|ang|ao|e|ei|en|eng|ou)?[wyxq]([bpmfdtnlgkhjqxzcsr]j?[iuv]?(a|ai|an|ang|ao|e|ei|en|eng|ou)?[wyxq]*"
      # accept: "v"
    - match: "[bpmfdtnlgkhjqxzcsr]j?[iuv]?(a|ai|an|ang|ao|e|ei|en|eng|ou)?[wyxq]"
      accept: "v"
    - match_shape: "v[^v]*"
      accept: "[a-z]"
  algebra:
    - xform/^([a-z]+)(;.*)$/$1①$2/
    - xform/^(.*)ā(.*)(;.*)$/$1a$2①$3/
    - xform/^(.*)á(.*)(;.*)$/$1a$2②$3/
    - xform/^(.*)ǎ(.*)(;.*)$/$1a$2③$3/
    - xform/^(.*)à(.*)(;.*)$/$1a$2④$3/
    - xform/^ō(;.*)$/ou$2①$3/
    - xform/^ó(;.*)$/ou$2②$3/
    - xform/^ǒ(;.*)$/ou$2③$3/
    - xform/^ò(;.*)$/ou$2④$3/
    - xform/^(.*)ō(.*)(;.*)$/$1o$2①$3/
    - xform/^(.*)ó(.*)(;.*)$/$1o$2②$3/
    - xform/^(.*)ǒ(.*)(;.*)$/$1o$2③$3/
    - xform/^(.*)ò(.*)(;.*)$/$1o$2④$3/
    - xform/^(.*)ē(.*)(;.*)$/$1e$2①$3/
    - xform/^(.*)é(.*)(;.*)$/$1e$2②$3/
    - xform/^(.*)ě(.*)(;.*)$/$1e$2③$3/
    - xform/^(.*)è(.*)(;.*)$/$1e$2④$3/
    - xform/^(.*)ī(.*)(;.*)$/$1i$2①$3/
    - xform/^(.*)í(.*)(;.*)$/$1i$2②$3/
    - xform/^(.*)ǐ(.*)(;.*)$/$1i$2③$3/
    - xform/^(.*)ì(.*)(;.*)$/$1i$2④$3/
    - xform/^(.*)ū(.*)(;.*)$/$1u$2①$3/
    - xform/^(.*)ú(.*)(;.*)$/$1u$2②$3/
    - xform/^(.*)ǔ(.*)(;.*)$/$1u$2③$3/
    - xform/^(.*)ù(.*)(;.*)$/$1u$2④$3/
    - xform/^(.*)ǖ(.*)(;.*)$/$1v$2①$3/
    - xform/^(.*)ǘ(.*)(;.*)$/$1v$2②$3/
    - xform/^(.*)ǚ(.*)(;.*)$/$1v$2③$3/
    - xform/^(.*)ǜ(.*)(;.*)$/$1v$2④$3/
    - xform/^(.*)ü(.*)$/$1v$2/
    - xform/^(.*)ń(.*)(;.*)$/$1en$2②$3/
    - xform/^(.*)ň(.*)(;.*)$/$1en$2③$3/
    - xform/^(.*)ǹ(.*)(;.*)$/$1en$2④$3/
    - xlit/①②③④/1234
    - xform/(;\w+)/\U$1/ # 辅助码改大写
    - derive/^ng(\d)(;.*)$/eng$1$2/
    - xform/^n(\d)(;.*)/en$1$2/
    - xform/^m(?=\d)/mu/
    - xform/^hm(?=\d)/hen/
    - xform/^([yl]?)o(?=\d)/$1e/
    # 韵调变换
    - xform/(?<=[jqxy])u/$1v/
    - xform/ui/uei/
    - xform/iu/iou/
    - xform/(?<=[iuv])n/en/
    - xform/ing/ieng/
    - xform/(?<![iy])ong/ueng/
    - xform/(iong|(?<=y)ong)/veng/
    - xform/(?<=[bpmfuw])o(?=\d)/e/
    # 声介变换
    - xlit/jqx/gkh/
    - xform/^(?=[aoeyw])/rj/
    - xform/^rjyv/rjv/
    - xform/^rjyi?/rji/
    - xform/^rjwu?/rju/
    - xform/^([zcs])h/$1j/
    # 隐含的韵母
    - xform/er//
    - xform/(?<=[bpmf])u//
    - xform/^([zcs]j?|r)i/$1/
    # 字母标调
    - xlit/1234/wyxq/
    # 支持声介简拼
    - abbrev/^([bpmfdtnlgkhzcsr]j?[iuv]).+$/$1/
#以下是双拼运算
    - derive/^(.*?);.*$/$1/ # 纯双拼的情况
#分号后面第一组辅助码
    - derive/^(.*?);(\w).*$/$1$2/        # 双拼+一位辅助码的情况
    - abbrev/^(.*?);(\w)(\w).*$/$1$2$3/  # 双拼+2位辅助码的情况
#分号后面第二组辅助码
    - derive/^(.*?);.*?,(\w).*$/$1$2/        # 双拼+一位辅助码的情况
    - abbrev/^(.*?);.*?,(\w)(\w).*$/$1$2$3/  # 双拼+2位辅助码的情况
    - erase/^(.+);(.+)$/    # 删除原始编码加速检索

translator:
  dictionary: wanxiang_pro
  user_dict: snow_yipin
  prism: snow_yipin
  preedit_format:
    # 字母标调
    - xlit/wyxq/1234/
    # 隐含的韵母
    - xform/([zcs]j?|r)(?=\d)/$1i/
    - xform/(?<=[bpmf])(?=\d)/u/
    - xform/rj(?=\d)/rjer/
    # 声介变换
    - xform/([zcs])j/$1h/
    - xform/rji(\d|en\d|eng\d)/rjyi$1/
    - xform/rji/rjy/
    - xform/rju(\d)/rjwu$1/
    - xform/rju/rjw/
    - xform/rjv/rjyv/
    - xform/rj//
    - xform/g(?=[iv])/j/
    - xform/k(?=[iv])/q/
    - xform/(?<![zcs])h(?=[iv])/x/
    # 韵调变换
    - xform/(?<=[bpmfuw])e(?=\d)/o/
    - xform/yveng/yong/
    - xform/veng/iong/
    - xform/ueng/ong/
    - xform/ieng/ing/
    - xform/(?<=[iuv])en/n/
    - xform/iou/iu/
    - xform/uei/ui/
    - xform/([jqxy])v/$1u/
    
    #- xform/.._/X/
    - xform ([aeiou])(ng?|r)([1234]) $1$3$2
    - xform ([aeo])([iuo])([1234]) $1$3$2
    - xform a1 ā
    - xform a2 á
    - xform a3 ǎ
    - xform a4 à
    - xform e1 ē
    - xform e2 é
    - xform e3 ě
    - xform e4 è
    - xform o1 ō
    - xform o2 ó
    - xform o3 ǒ
    - xform o4 ò
    - xform i1 ī
    - xform i2 í
    - xform i3 ǐ
    - xform i4 ì
    - xform u1 ū
    - xform u2 ú
    - xform u3 ǔ
    - xform u4 ù
    - xform v1 ǖ
    - xform v2 ǘ
    - xform v3 ǚ
    - xform v4 ǜ
    - xform v ü
  comment_format:
    - xform/~.*//

