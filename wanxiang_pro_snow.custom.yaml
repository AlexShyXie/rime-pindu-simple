    - xform/(?<=[jqxy])u/$1v/
    - xform/ui/uei/
    - xform/iu/iou/
    - xform/(?<=[iuv])n/en/
    - xform/ing/ieng/
    - xform/(?<![iy])ong/ueng/
    - xform/(iong|(?<=y)ong)/veng/
