    - xform/^([zcs]j?|r)i/$1/
    # 字母标调
    - xlit/1234/wyxq/
    # 支持声介简拼
    - abbrev/^([bpmfdtnlgkhzcsr]j?[iuv]).+$/$1/

直接辅助:  ########################################位于词库第三个分号后
  __append:
#以下是双拼运算
    - derive/^(.*?);.*$/$1/ # 纯双拼的情况
#分号后面第一组辅助码
    - derive/^(.*?);(\w).*$/$1$2/        # 双拼+一位辅助码的情况
    - abbrev/^(.*?);(\w)(\w).*$/$1$2$3/  # 双拼+2位辅助码的情况
#分号后面第二组辅助码
    - derive/^(.*?);.*?,(\w).*$/$1$2/        # 双拼+一位辅助码的情况
    - abbrev/^(.*?);.*?,(\w)(\w).*$/$1$2$3/  # 双拼+2位辅助码的情况
    - erase/^(.+);(.+)$/    # 删除原始编码加速检索
