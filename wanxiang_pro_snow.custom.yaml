#并击处理器
  chord_composer:
    finish_chord_on_first_key_release: true #有一键被释放时立刻触发合成
    alphabet: "qazwsxedcrfvtgbyhnujmik,ol.p;/' "
    algebra:
      # 左手并击Y，打出声介的三四五六选
      - xform/^([qazwsxedcrfvtgb]+)'$/o★$1★-- /
      - xform/^([qazwsxedcrfvtgb]+)uo$/o★$1★--- /
      - xform/^([qazwsxedcrfvtgb]+)yp$/o★$1★---- /
      - xform/^([qazwsxedcrfvtgb]+)up$/o★$1★----- /
      - xform/^([qazwsxedcrfvtgb]+)ip$/o★$1★------ /
      - xform/^([qazwsxedcrfvtgb]+)op$/o★$1★------- /
      # 双手并击，打出音节
      - xform|^([qazwsxedcrfvtgb]+)([p;/ol.ik,ujmyhn]+)$|★$1★★$2★|
      # 双手带空格并击，打出追加音节，这里 u 表示追加
      - xform|^([qazwsxedcrfvtgb]+)([p;/ol.ik,ujmyhn]+) $|u★$1★★$2★|
      # 双手带空格并击，打出音节完整音节直接上屏，这里 o 表示追加
      # - xform|^([qazwsxedcrfvtgb]+)([p;/ol.ik,ujmyhn]+) $|o★$1★★$2★ |
      # 左手或右手带空格并击，打出辅助码)######################################(注释掉,使用万象的辅助码)
      # - xform/^([qazwsxedcrfvtgb]+) $/v★$1★v/
      # - xform/^([yhnujmikolp]+) $/v$1$1v/
      # 左手并击，打出声介（一简字）
      - xform/^([qazwsxedcrfvtgb]+)$/o★$1★ /
      # 左手并击带空格，打出声介的二选（一简词）
      - xform/^([qazwsxedcrfvtgb]+) $/o★$1★- /

      # 右手单键击键
      - xform|^h$|/iduh | # '、'
      - xform|^j$|/idh | # '，'
      - xform|^k$|/ijh | # '。'
      - xform|^l$|/iwh | # '？'
      - xform|^l $|/ith | # '！'
      - xform|^y$|/dy|
      - xform|^y $|/dy |
      - xform|^u$|- |
      - xform|^i$|-- |
      #- xform|^o$|/dy- |
      #- xform|^p$|/dy-- |
      # - xform|^p$|------ |
      # 右手组合击键，打出对应的符号
      - xform|^n$|{Escape}|
      - xform|^m$|{BackSpace}|
      - xform|^m,$|/dy| 
      - xform|^,\.$|/dy| 
      - xform|^m\.$|/ibq|
      - xform|^m\/$|/idw|
      - xform/^jk$/{Page_Up}/
      # - xform/^kl$/-- /
      # - xform|^ui$|--- |
      # - xform|^io$|---- | 
      # - xform|^uo$|----- |
      # - xform|^up$|---- | 
      - xform/^jl$/{Page_Down}/
      # - xform/^j;$/iwh /
      - xform/-/{Down}/
      # - xform/^hk$/{Page_Up}/
      # - xform/^hl$/{Page_Down}/
      # 左手+右手'jio'并击，打出辅助码
      #- xform|^★([qazwsxedcrfvtgb])★★jio★$|\U$1|
      # 右手+左手'wef'并击，打出辅助码
      #- xform|^★wef★★([polikujmyhn])★$|\U$1|

      # 左手声介
      - xform/★r★/rj/ # 而
      - xform/★df★/rji/ # 其
