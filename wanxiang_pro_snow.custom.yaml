    - xform/(?<![zcs])h(?=[iv])/x/
    # 韵调变换
    - xform/(?<=[bpmfuw])e(?=\d)/o/
    - xform/yveng/yong/
    - xform/veng/iong/
    - xform/ueng/ong/
    - xform/ieng/ing/
    - xform/(?<=[iuv])en/n/
    - xform/iou/iu/
