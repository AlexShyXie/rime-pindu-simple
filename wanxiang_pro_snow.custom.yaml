    - xform/^(.*)ň(.*)(;.*)$/$1en$2③$3/
    - xform/^(.*)ǹ(.*)(;.*)$/$1en$2④$3/
    - xlit/①②③④/1234
    - xform/(;\w+)/\U$1/ # 辅助码改大写
    - derive/^ng(\d)(;.*)$/eng$1$2/
    - xform/^n(\d)(;.*)/en$1$2/
    - xform/^m(?=\d)/mu/
    - xform/^hm(?=\d)/hen/
    #- xform/^o(?=\d)/o/
    - xform/^([yl]?)o(?=\d)/$1e/
